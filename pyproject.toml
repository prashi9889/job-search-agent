[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jobagent"
version = "0.1.0"
description = "Personal, local-first job search assistant"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "python-dateutil>=2.9",
  "keyring>=25",
  "google-api-python-client>=2.130",
  "google-auth-oauthlib>=1.2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
jobagent = "jobagent.cli:main"

[tool.setuptools]
packages = ["jobagent"]

[tool.setuptools.package-data]
jobagent = ["sources.json"]
